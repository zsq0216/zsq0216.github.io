  highlights:
  - title: Cross-framework Trajectory Rewriting
    description: For training-data transfer across agent frameworks, I designed a unified trajectory representation
      that captures operation types, targets, content, and execution context, while linking tool calls to their
      feedback. I adapt actions according to tool-call semantics and execution constraints, retaining unsupported
      interactions as historical context with key operational information. The work covers six frameworks and 10,000
      trajectories.
  - title: Post-training Data Construction & Validation
    description: I construct target-framework SFT data from rewritten trajectories and evaluate it on SWE-bench
      Verified, Pro, and Multilingual.
    result: Using the same source trajectories, this approach improves Verified resolved rates over SFT on the original
      trajectories by 12.4 and 7.4 percentage points in OpenHands and SWE-agent, respectively.
    publication:
      venue: ICLR 2027
      status: Under review · First author
  - title: Failure Diagnosis & Recovery
    description: For CVE-related software vulnerability repair tasks, I study offline diagnosis of failed trajectories,
      recovery-point identification, and execution replay. By re-executing historical tool calls and filling in
      observations, I reconstruct intermediate state and explore methods for turning failed executions into successful
      training demonstrations.
