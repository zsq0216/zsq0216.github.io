short_bio: <p>I am a Ph.D. student in Computer Science and Technology at the School of Computer Science, Peking
  University. I received my B.S. in Software Engineering from Fudan University in 2025.</p><p>My research focuses
  on coding agents, agent post-training, and data synthesis. I study cross-framework trajectory adaptation, the
  construction and evaluation of post-training data, and task and environment design for agent evaluation.</p><p>I
  am currently a research intern at Shanghai Artificial Intelligence Laboratory, working on trajectory rewriting
  and post-training data for coding agents, as well as diagnosis and recovery of failed execution in software vulnerability
  repair tasks.</p><p><strong>Research interests:</strong> Coding Agent · Agent Post-training · Data Synthesis</p>
