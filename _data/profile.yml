  highlights:
  - title: Trajectory Standardization & Rewriting
    description: For software engineering tasks, I rewrite heterogeneous trajectories into SFT data for a target
      agent framework. A shared intermediate representation and tool contracts constrain tool-call adaptation, while
      interactions that cannot be adapted are retained as context with zero training loss to preserve both action
      semantics and the evidence behind subsequent reasoning.
    result: Using the same source trajectories, this approach improves SWE-bench Verified resolved rates over direct
      source-trajectory training by 12.40 and 7.40 percentage points in OpenHands and SWE-agent, respectively.
    publication:
      title: TraceBridge
      venue: ICLR 2027
      status: Under review · First author
      code: https://github.com/zsq0216/trace-bridge
  - title: Trajectory Auditing & Replay (Ongoing)
    description: For CVE vulnerability tasks, I am developing a workflow that connects offline diagnosis, recovery-boundary
      identification, and trajectory-prefix replay. Re-executing historical calls and filling in observations reconstruct
      intermediate state; I am exploring re-execution from critical steps to produce successful demonstrations.
