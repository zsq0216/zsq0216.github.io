short_bio: <p>I am a Ph.D. student in Computer Science and Technology at Peking University. Previously, I received my B.S. in Software Engineering from Fudan University in 2025.</p><p>My research focuses on LLM agents and AI software engineering, with interests in coding agents, agent harnesses, and training environments. I also work on efficient and reliable LLM systems, including inference optimization, configuration tuning, and empirical bug analysis.</p><p><strong>Research interests:</strong> LLM agents, AI software engineering, and efficient and reliable LLM systems.</p>
