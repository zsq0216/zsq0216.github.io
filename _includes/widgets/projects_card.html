<div class="my-3 p-0 bg-white shadow-sm rounded-xl">
    <h6 class="border-bottom border-gray p-3 mb-0">
        <i class="fas fa-code" aria-hidden="true"></i> Research &amp; Projects
    </h6>
    {% for project in site.data.projects %}
    <article class="p-4 {% unless forloop.last %}border-bottom border-gray{% endunless %}">
        <div class="d-flex flex-wrap justify-content-between small text-muted mb-2">
            <span>{{ project.subtitle }}</span>
            <span>{{ project.period }}</span>
        </div>
        <h5 class="font-weight-normal">{{ project.title }}</h5>
        <p class="small text-muted mb-2">{{ project.description }}</p>
        {% if project.url != '' %}
        <a class="small" href="{{ project.url }}" target="_blank" rel="noopener noreferrer"><i class="fab fa-github" aria-hidden="true"></i> Code on GitHub</a>
        {% endif %}
    </article>
    {% endfor %}
</div>
